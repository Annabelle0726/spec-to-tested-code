<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040" role="img" aria-labelledby="label"><title id="label">rule-to-evidence-mobile</title><defs>
<filter id="shadow" x="-20%" y="-25%" width="150%" height="175%"><feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#122139" flood-opacity=".16"/></filter>
<linearGradient id="sheet" x2=".9" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#eee9de"/></linearGradient>
<linearGradient id="dark" x2="1" y2="1"><stop stop-color="#1c3555"/><stop offset="1" stop-color="#101f33"/></linearGradient>
<linearGradient id="gold" x2="1" y2=".4"><stop stop-color="#ecdbb5"/><stop offset=".45" stop-color="#f6e9c8"/><stop offset="1" stop-color="#d5ba7f"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#b4c8e3" stroke-opacity=".06" fill="none"/></pattern>
<pattern id="grain" width="8" height="9" patternUnits="userSpaceOnUse"><circle cx="1" cy="2" r=".5" fill="#685c41" opacity=".09"/><path d="M5 7h2" stroke="#fff" stroke-opacity=".4" stroke-width=".6"/></pattern>
</defs><rect x="0" y="0" width="720" height="1040" rx="2" fill="url(#dark)" stroke="none" /><rect x="0" y="0" width="720" height="1040" rx="2" fill="url(#grid)" stroke="none" /><text x="36" y="47" fill="#dec58e" font-family="Consolas,monospace" font-size="14" font-weight="400" letter-spacing="2">THE EVIDENCE</text><text x="34" y="109" fill="#f3f0e7" font-family="Arial,Microsoft YaHei,sans-serif" font-size="35" font-weight="600" >同一条约定，贯穿验证。</text><g transform="rotate(0 360.0 281.0)"><rect x="41" y="173" width="646" height="232" rx="2" fill="#d1c8b5" stroke="none" /><rect x="39" y="169" width="646" height="232" rx="2" fill="#f3eee0" stroke="#bdb5a5" /><rect x="37" y="165" width="646" height="232" rx="2" fill="url(#sheet)" stroke="#d1c9b8" filter="url(#shadow)"/><text x="63" y="207" fill="#31588c" font-family="Consolas,monospace" font-size="18" font-weight="600" >R1</text><text x="657" y="207" fill="#637183" font-family="Consolas,monospace" font-size="12" font-weight="400" text-anchor="end">CONFIRMED RULE</text><path d="M63 225 L657 225" fill="none" stroke="#d0c6b3" /><text x="63" y="279" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="32" font-weight="600" >已确认规则</text><text x="63" y="323" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" >本人可取消未发货订单。</text><text x="63" y="360" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" >成功后状态变为已取消。</text></g><g transform="rotate(0 360.0 547.0)"><rect x="41" y="439" width="646" height="232" rx="2" fill="#d1c8b5" stroke="none" /><rect x="39" y="435" width="646" height="232" rx="2" fill="#f3eee0" stroke="#bdb5a5" /><rect x="37" y="431" width="646" height="232" rx="2" fill="url(#sheet)" stroke="#d1c9b8" filter="url(#shadow)"/><text x="63" y="473" fill="#31588c" font-family="Consolas,monospace" font-size="18" font-weight="600" >S1 / R1</text><text x="657" y="473" fill="#637183" font-family="Consolas,monospace" font-size="12" font-weight="400" text-anchor="end">BEHAVIOR SCENARIO</text><path d="M63 491 L657 491" fill="none" stroke="#d0c6b3" /><text x="63" y="545" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="32" font-weight="600" >具体场景</text><text x="63" y="589" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" >甲取消自己的未发货订单。</text><text x="63" y="626" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" >重新读取时，状态为已取消。</text></g><g transform="rotate(0 360.0 813.0)"><rect x="41" y="705" width="646" height="232" rx="2" fill="#d1c8b5" stroke="none" /><rect x="39" y="701" width="646" height="232" rx="2" fill="#f3eee0" stroke="#bdb5a5" /><rect x="37" y="697" width="646" height="232" rx="2" fill="url(#gold)" stroke="#d1c9b8" filter="url(#shadow)"/><text x="63" y="739" fill="#31588c" font-family="Consolas,monospace" font-size="18" font-weight="600" >T1 / S1</text><text x="657" y="739" fill="#637183" font-family="Consolas,monospace" font-size="12" font-weight="400" text-anchor="end">VERIFICATION</text><path d="M63 757 L657 757" fill="none" stroke="#d0c6b3" /><text x="63" y="811" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="32" font-weight="600" >验证要点</text><text x="63" y="855" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" >核对返回结果与最终状态。</text><text x="63" y="892" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" >未执行的检查如实标明。</text></g><text x="36" y="1011" fill="#bdc8d6" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" >方法示意，非执行记录。</text></svg>