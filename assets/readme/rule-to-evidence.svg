<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-labelledby="label"><title id="label">rule-to-evidence</title><defs>
<filter id="shadow" x="-20%" y="-25%" width="150%" height="175%"><feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#122139" flood-opacity=".16"/></filter>
<linearGradient id="sheet" x2=".9" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#eee9de"/></linearGradient>
<linearGradient id="dark" x2="1" y2="1"><stop stop-color="#1c3555"/><stop offset="1" stop-color="#101f33"/></linearGradient>
<linearGradient id="gold" x2="1" y2=".4"><stop stop-color="#ecdbb5"/><stop offset=".45" stop-color="#f6e9c8"/><stop offset="1" stop-color="#d5ba7f"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#b4c8e3" stroke-opacity=".06" fill="none"/></pattern>
<pattern id="grain" width="8" height="9" patternUnits="userSpaceOnUse"><circle cx="1" cy="2" r=".5" fill="#685c41" opacity=".09"/><path d="M5 7h2" stroke="#fff" stroke-opacity=".4" stroke-width=".6"/></pattern>
</defs><rect x="0" y="0" width="1440" height="660" rx="2" fill="url(#dark)" stroke="none" /><rect x="0" y="0" width="1440" height="660" rx="2" fill="url(#grid)" stroke="none" /><circle cx="1440" cy="0" r="180" fill="none" stroke="#b2c0d7" stroke-opacity=".08"/><circle cx="1440" cy="0" r="260" fill="none" stroke="#b2c0d7" stroke-opacity=".08"/><circle cx="1440" cy="0" r="340" fill="none" stroke="#b2c0d7" stroke-opacity=".08"/><text x="58" y="55" fill="#dec58e" font-family="Consolas,monospace" font-size="13" font-weight="400" letter-spacing="2">THE EVIDENCE / ONE SHARED AGREEMENT</text><text x="57" y="124" fill="#f3f0e7" font-family="Arial,Microsoft YaHei,sans-serif" font-size="48" font-weight="600" >同一条约定，贯穿场景与验证。</text><g transform="rotate(-1.2 266.0 369.0)"><rect x="68" y="203" width="404" height="348" rx="2" fill="#d1c8b5" stroke="none" /><rect x="66" y="199" width="404" height="348" rx="2" fill="#f3eee0" stroke="#bdb5a5" /><rect x="64" y="195" width="404" height="348" rx="2" fill="url(#sheet)" stroke="#d1c9b8" filter="url(#shadow)"/><text x="92" y="235" fill="#31588c" font-family="Consolas,monospace" font-size="20" font-weight="600" >R1</text><text x="440" y="235" fill="#637183" font-family="Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" letter-spacing="1.5">CONFIRMED RULE</text><path d="M92 255 L440 255" fill="none" stroke="#d4ccbb" /><text x="92" y="308" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="33" font-weight="600" >已确认规则</text><text x="92" y="370" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" >本人可取消未发货订单。</text><text x="92" y="413" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" >成功后状态变为已取消。</text><path d="M92 464 L440 464" fill="none" stroke="#b7aa8c" /><text x="92" y="502" fill="#31588c" font-family="Consolas,monospace" font-size="12" font-weight="400" letter-spacing="1.4">AGREEMENT</text></g><g transform="rotate(0 721.0 369.0)"><rect x="523" y="203" width="404" height="348" rx="2" fill="#d1c8b5" stroke="none" /><rect x="521" y="199" width="404" height="348" rx="2" fill="#f3eee0" stroke="#bdb5a5" /><rect x="519" y="195" width="404" height="348" rx="2" fill="url(#sheet)" stroke="#d1c9b8" filter="url(#shadow)"/><text x="547" y="235" fill="#31588c" font-family="Consolas,monospace" font-size="20" font-weight="600" >S1 / R1</text><text x="895" y="235" fill="#637183" font-family="Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" letter-spacing="1.5">BEHAVIOR SCENARIO</text><path d="M547 255 L895 255" fill="none" stroke="#d4ccbb" /><text x="547" y="308" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="33" font-weight="600" >具体场景</text><text x="547" y="370" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" >甲取消自己的未发货订单。</text><text x="547" y="413" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" >重新读取时，状态为已取消。</text><path d="M547 464 L895 464" fill="none" stroke="#b7aa8c" /><text x="547" y="502" fill="#31588c" font-family="Consolas,monospace" font-size="12" font-weight="400" letter-spacing="1.4">OBSERVABLE BEHAVIOR</text></g><g transform="rotate(1.2 1176.0 369.0)"><rect x="978" y="203" width="404" height="348" rx="2" fill="#d1c8b5" stroke="none" /><rect x="976" y="199" width="404" height="348" rx="2" fill="#f3eee0" stroke="#bdb5a5" /><rect x="974" y="195" width="404" height="348" rx="2" fill="url(#gold)" stroke="#d1c9b8" filter="url(#shadow)"/><text x="1002" y="235" fill="#31588c" font-family="Consolas,monospace" font-size="20" font-weight="600" >T1 / S1</text><text x="1350" y="235" fill="#637183" font-family="Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" letter-spacing="1.5">VERIFICATION</text><path d="M1002 255 L1350 255" fill="none" stroke="#d4ccbb" /><text x="1002" y="308" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="33" font-weight="600" >验证要点</text><text x="1002" y="370" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" >核对返回结果与最终状态。</text><text x="1002" y="413" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" >未执行的检查如实标明。</text><path d="M1002 464 L1350 464" fill="none" stroke="#b7aa8c" /><text x="1002" y="502" fill="#31588c" font-family="Consolas,monospace" font-size="12" font-weight="400" letter-spacing="1.4">EXECUTION EVIDENCE</text></g><path d="M60 588 L1380 588" fill="none" stroke="#4b5b71" /><text x="61" y="624" fill="#b6c2d4" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" >场景示意 · 说明工作方法，非已执行测试记录。</text><text x="1380" y="624" fill="#dec58e" font-family="Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" letter-spacing="1.5">TRACE THE SAME RULE.</text></svg>