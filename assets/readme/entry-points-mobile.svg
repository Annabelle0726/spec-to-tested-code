</defs><rect x="0" y="0" width="720" height="1040" rx="2" fill="#f3f0e7" stroke="none" /><rect x="0" y="0" width="720" height="1040" rx="2" fill="url(#grain)" stroke="none" /><text x="36" y="47" fill="#31588c" font-family="Consolas,monospace" font-size="14" font-weight="400" letter-spacing="2">THE FIELD GUIDE</text><text x="34" y="109" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="35" font-weight="600" >从你现在的位置开始。</text><g transform="rotate(0 360.0 281.0)"><rect x="41" y="173" width="646" height="232" rx="2" fill="#d1c8b5" stroke="none" /><rect x="39" y="169" width="646" height="232" rx="2" fill="#f3eee0" stroke="#bdb5a5" /><rect x="37" y="165" width="646" height="232" rx="2" fill="url(#sheet)" stroke="#d1c9b8" filter="url(#shadow)"/><text x="63" y="207" fill="#31588c" font-family="Consolas,monospace" font-size="18" font-weight="600" >01</text><text x="657" y="207" fill="#637183" font-family="Consolas,monospace" font-size="12" font-weight="400" text-anchor="end">DISCOVERY</text><path d="M63 225 L657 225" fill="none" stroke="#d0c6b3" /><text x="63" y="279" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="32" font-weight="600" >需求还模糊</text><text x="63" y="329" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" >已确认规则 / 验收场景</text><text x="63" y="367" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" >待决问题</text></g><g transform="rotate(0 360.0 547.0)"><rect x="41" y="439" width="646" height="232" rx="2" fill="#d1c8b5" stroke="none" /><rect x="39" y="435" width="646" height="232" rx="2" fill="#f3eee0" stroke="#bdb5a5" /><rect x="37" y="431" width="646" height="232" rx="2" fill="url(#sheet)" stroke="#d1c9b8" filter="url(#shadow)"/><text x="63" y="473" fill="#31588c" font-family="Consolas,monospace" font-size="18" font-weight="600" >02</text><text x="657" y="473" fill="#637183" font-family="Consolas,monospace" font-size="12" font-weight="400" text-anchor="end">IMPLEMENTATION</text><path d="M63 491 L657 491" fill="none" stroke="#d0c6b3" /><text x="63" y="545" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="32" font-weight="600" >规则已确认</text><text x="63" y="595" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" >有效的失败测试 / 最小实现</text><text x="63" y="633" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" >受保护的重构</text></g><g transform="rotate(0 360.0 813.0)"><rect x="41" y="705" width="646" height="232" rx="2" fill="#d1c8b5" stroke="none" /><rect x="39" y="701" width="646" height="232" rx="2" fill="#f3eee0" stroke="#bdb5a5" /><rect x="37" y="697" width="646" height="232" rx="2" fill="url(#sheet)" stroke="#d1c9b8" filter="url(#shadow)"/><text x="63" y="739" fill="#31588c" font-family="Consolas,monospace" font-size="18" font-weight="600" >03</text><text x="657" y="739" fill="#637183" font-family="Consolas,monospace" font-size="12" font-weight="400" text-anchor="end">DIAGNOSIS</text><path d="M63 757 L657 757" fill="none" stroke="#d0c6b3" /><text x="63" y="811" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="32" font-weight="600" >出现了缺陷</text><text x="63" y="861" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" >最小复现 / 有证据的根因</text><text x="63" y="899" fill="#172941" font-family="Arial,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" >回归验证</text></g><text x="36" y="1011" fill="#637183" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" >只做规格时停在规格，已授权实现时继续推进。</text></svg>